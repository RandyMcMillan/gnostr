[package]
name = "rustylib"
version = "953263.1868.499801"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]
name = "rustylib"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
gnostr-asyncgit = { version = ">=953263.1868.499801", path = "../../../asyncgit", features = [
  "nostr",
  "vendor-openssl",
  "vendored-openssl",
] }
uniffi = { version = "0.28.0", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.28.0", features = ["build"] }

[workspace]
