[package]
name = "relay_ffi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
actix-web = { version = "4.9.0" }
gnostr-relay = { path = "../../../../relay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
